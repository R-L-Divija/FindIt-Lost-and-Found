<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FindIt Image Upload Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: #f7f5ff;
            color: #222;
        }

        main {
            background: white;
            padding: 24px;
            border-radius: 16px;
        }

        input,
        button {
            display: block;
            width: 100%;
            box-sizing: border-box;
            margin: 14px 0;
            padding: 12px;
        }

        button {
            background: #6d28d9;
            color: white;
            border: 0;
            border-radius: 8px;
            cursor: pointer;
        }

        img {
            max-width: 100%;
            margin-top: 16px;
            border-radius: 8px;
        }

        #result {
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>
    <main>
        <h1>FindIt Image Upload Test</h1>
        <p>Sign in first, then upload a test image.</p>

        <label>Email</label>
        <input id="email" type="email" placeholder="Your registered email" />

        <label>Password</label>
        <input id="password" type="password" placeholder="Your password" />

        <button id="signin">Sign In</button>

        <label>Select an image (JPG, PNG, WebP; max 5 MB)</label>
        <input id="image" type="file" accept="image/jpeg,image/png,image/webp" />

        <button id="upload">Upload Image</button>

        <div id="result" role="status"></div>
        <img id="preview" alt="Uploaded image preview" hidden />
    </main>

    <script>
        const API = "http://localhost:5000";
        let token = "";

        const result = document.getElementById("result");

        document.getElementById("signin").onclick = async () => {
            result.textContent = "Signing in...";

            try {
                const response = await fetch(`${API}/api/auth/signin`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        email: document.getElementById("email").value,
                        password: document.getElementById("password").value
                    })
                });

                const data = await response.json();

                if (!response.ok) throw new Error(data.message || "Sign in failed");

                token = data.token;
                result.textContent = "Signed in successfully. You can upload an image.";
            } catch (error) {
                result.textContent = error.message;
            }
        };

        document.getElementById("upload").onclick = async () => {
            const file = document.getElementById("image").files[0];

            if (!token) {
                result.textContent = "Please sign in first.";
                return;
            }

            if (!file) {
                result.textContent = "Please select an image.";
                return;
            }

            if (file.size > 5 * 1024 * 1024) {
                result.textContent = "Image must be 5 MB or smaller.";
                return;
            }

            result.textContent = "Uploading...";

            try {
                const formData = new FormData();
                formData.append("image", file);

                const response = await fetch(`${API}/api/uploads/item-image`, {
                    method: "POST",
                    headers: { Authorization: `Bearer ${token}` },
                    body: formData
                });

                const data = await response.json();

                if (!response.ok) throw new Error(data.message || "Upload failed");

                result.innerHTML = "";

                const message = document.createElement("p");
                message.textContent = "Image uploaded successfully!";
                result.appendChild(message);

                const link = document.createElement("a");
                link.href = data.imageUrl;
                link.target = "_blank";
                link.rel = "noopener noreferrer";
                link.textContent = "Open uploaded image";
                result.appendChild(link);

                const preview = document.getElementById("preview");
                preview.src = data.imageUrl;
                preview.hidden = false;
            } catch (error) {
                result.textContent = error.message;
            }
        };
    </script>
</body>

</html>
